<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sensor</title>
<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/vendor/hammer.min.js"></script>
<script src="/static/vendor/chartjs-plugin-zoom.min.js"></script>
<style>
  :root{
    --bg:#0e1420; --card1:#17202c; --card2:#1b2533; --txt:#e8edf2;
    --muted:#7f90a8; --muted2:#5f7088; --accent:#4cc9f0; --accent2:#9be4ff;
    --hum:#e879c9; --ok:#52d273; --warn:#ffb454; --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,system-ui,sans-serif;
       background:radial-gradient(1100px 520px at 80% -12%,#16323f,var(--bg));
       color:var(--txt);min-height:100vh;padding:clamp(14px,3vw,26px)}
  .wrap{max-width:1100px;margin:0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
  .title{font-size:19px;font-weight:600}
  .subtitle{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-top:2px}
  .controls{display:flex;align-items:center;gap:12px}
  .bars{display:flex;align-items:flex-end;gap:3px;height:16px}
  .bars i{width:4px;border-radius:1px;display:block}
  .badge-live{display:flex;align-items:center;gap:7px;font-size:13px;color:#9fb0c4;
       background:#52d2731a;border:1px solid #52d27333;padding:5px 12px;border-radius:999px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 9px var(--ok)}
  .btn{background:linear-gradient(120deg,var(--accent),#7aa7ff);color:#04222e;border:none;
       border-radius:999px;padding:9px 17px;font-size:13.5px;font-weight:600;cursor:pointer;
       min-height:40px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .btn:disabled{opacity:.6;cursor:default}
  .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}
  .card{background:linear-gradient(160deg,var(--card1),var(--card2));border:1px solid #ffffff10;
        border-radius:var(--radius);padding:18px}
  .hero{grid-row:span 2;display:flex;flex-direction:column}
  .label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .herobody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
  .heronum{font-size:clamp(46px,8vw,72px);font-weight:700;line-height:.85;
       background:linear-gradient(120deg,var(--accent2),#c9b3ff);-webkit-background-clip:text;
       background-clip:text;color:transparent}
  .unit{font-size:20px;color:var(--muted);font-weight:500}
  .pill{padding:5px 13px;border-radius:999px;background:#52d27322;color:#7fe6a0;font-size:12.5px;border:1px solid #52d27340}
  .val{font-size:32px;font-weight:700;margin-top:8px}
  .val .u{font-size:15px;color:var(--muted)}
  .sub{font-size:11px;color:var(--muted2);margin-top:6px}
  .fresh{font-size:11px;color:var(--muted2)}
  .badge{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;
         font-size:11px;background:#ffb45422;color:var(--warn);border:1px solid #ffb45455}
  .today{font-size:24px;font-weight:700;margin-top:10px;display:flex;align-items:baseline;gap:8px}
  .today .hi{color:var(--accent2)} .today .lo{color:#7aa7ff}
  /* gap banner */
  .gapcard{margin-top:14px;border:1px solid #ffffff10;background:linear-gradient(160deg,var(--card1),var(--card2));border-radius:var(--radius);padding:16px}
  .gapcard.gap{border-color:#ffb45440;background:#ffb4540e}
  .gaprow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .gapfill{font-size:13px;color:var(--muted)}
  .gapcard.gap .gapfill{color:#ffca7a}
  .fillbtn{background:linear-gradient(120deg,var(--accent),#7aa7ff);color:#04222e;border:none;
       border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:36px}
  .progress{margin-top:12px}
  .ptrack{height:8px;border-radius:999px;background:#0c131c;border:1px solid #ffffff10;overflow:hidden}
  .pbar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7aa7ff);transition:width .3s}
  .ptext{font-size:11.5px;color:#9fb0c4;margin-bottom:7px;display:flex;align-items:center;gap:8px}
  /* charts */
  .charts{margin-top:14px}
  .charthead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px}
  .hint{font-size:10.5px;color:var(--muted2)}
  .chips{display:flex;gap:6px}
  .chips button{font-size:12px;padding:5px 12px;border-radius:999px;background:#0e1620;color:var(--muted);
       border:1px solid #ffffff10;cursor:pointer;min-height:36px;touch-action:manipulation}
  .chips button.active{background:var(--accent);color:#04222e;border-color:transparent;font-weight:600}
  .chartbox{position:relative;height:clamp(190px,32vw,230px);margin-top:6px}
  .chartbox.tall{height:clamp(360px,58vw,480px)}
  canvas{width:100%!important}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.06);filter:brightness(1.25)}100%{transform:scale(1)}}
  .pulse{animation:pulse .5s ease-out;display:inline-block}
  @media (max-width:680px){
    .grid{grid-template-columns:1fr 1fr}
    .hero{grid-row:span 1;grid-column:span 2}
  }
  @media (max-width:420px){ .grid{grid-template-columns:1fr} .hero{grid-column:span 1} }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <div class="title">LYWSD03MMC</div>
      <div class="subtitle">Sensor Monitor</div>
    </div>
    <div class="controls">
      <span class="bars" id="signalBars" title="Signal strength"></span>
      <span class="badge-live"><span class="dot" id="liveDot"></span><span id="liveBadge">—</span></span>
      <button class="btn" id="updateBtn">↻ Update</button>
    </div>
  </div>

  <div class="grid">
    <div class="card hero">
      <div class="label">Temperature</div>
      <div class="herobody">
        <div><span class="heronum" id="temp">--</span><span class="unit"> °C</span></div>
        <div class="fresh" id="tempUpdated">—</div>
      </div>
    </div>

    <div class="card">
      <div class="label">Humidity</div>
      <div class="val"><span id="hum">--</span><span class="u"> %</span></div>
      <div class="fresh" id="humUpdated">—</div>
    </div>

    <div class="card">
      <div class="label">Battery</div>
      <div class="val"><span id="bat">--</span><span class="u"> %</span><span id="batbadge"></span></div>
      <div class="sub"><span id="batSub">—</span></div>
      <div class="fresh" id="batUpdated">—</div>
    </div>

    <div class="card" style="grid-column:span 2">
      <div class="label">Today</div>
      <div class="today"><span class="hi" id="todayHigh">—</span><span class="lo" id="todayLow">—</span><span class="u" style="font-size:13px;color:var(--muted)">°C</span></div>
      <div class="sub" id="todaySub">—</div>
    </div>
  </div>

  <div class="gapcard" id="gapWrap">
    <div class="gaprow">
      <span class="gapfill" id="gapFillable">Pull the sensor's stored history</span>
      <button class="fillbtn" id="fillBtn">⤓ Fetch from sensor</button>
    </div>
    <div class="progress" id="fillProgressWrap" style="display:none">
      <div class="ptext" id="fillProgressText">Connecting…</div>
      <div class="ptrack"><div class="pbar" id="fillProgressBar"></div></div>
    </div>
  </div>

  <div class="charts">
    <div class="charthead">
      <div class="label">Temperature &amp; Humidity</div>
      <div style="display:flex;align-items:center;gap:14px">
        <span class="hint">drag or scroll sideways to pan · pinch or Ctrl-scroll to zoom</span>
        <div class="chips" id="ranges">
          <button data-r="6h">6h</button>
          <button data-r="24h" class="active">24h</button>
          <button data-r="7d">7d</button>
          <button data-r="all">All</button>
        </div>
      </div>
    </div>
    <div class="card"><div class="chartbox tall"><canvas id="chart"></canvas></div></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
let lastSnap = {};
let chart = null, win = null, extent = null, fetchTimer = null, activeToken = "24h", lastFetch = 0;
const COLORS = {temp:"#9be4ff", hum:"#e879c9"};
const IS_TOUCH = window.matchMedia("(pointer: coarse)").matches;

/* ---------- live values ---------- */
function ago(ts){
  if(!ts) return "—";
  const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if(s < 60)   return `updated ${s}s ago`;
  if(s < 3600) return `updated ${Math.floor(s/60)}m ago`;
  if(s < 86400)return `updated ${Math.floor(s/3600)}h ago`;
  return `updated ${Math.floor(s/86400)}d ago`;
}
function setVal(id, val, fmt){
  const el = $(id);
  const t = (val === null || val === undefined) ? "--" : fmt(val);
  if(el.textContent !== t){
    el.textContent = t;
    el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
  }
}
function renderBars(n){
  const c = $("signalBars"); c.innerHTML = "";
  for(let i=0;i<4;i++){
    const b = document.createElement("i");
    b.style.height = (5 + i*4) + "px";
    b.style.background = i < n ? "#4cc9f0" : "#2b3a4a";
    c.appendChild(b);
  }
}
function renderFreshness(){
  $("tempUpdated").textContent = ago(lastSnap.temperature_ts);
  $("humUpdated").textContent  = ago(lastSnap.humidity_ts);
  $("batUpdated").textContent  = ago(lastSnap.battery_ts);
}
async function refreshCurrent(){
  let r; try{ r = await (await fetch("/api/current")).json(); }catch(e){ return; }
  lastSnap = r;
  setVal("temp", r.temperature, v=>v.toFixed(1));
  setVal("hum",  r.humidity,    v=>v.toFixed(0));
  setVal("bat",  r.battery,     v=>String(v));
  setVal("todayHigh", r.today_high, v=>"↑"+v.toFixed(1));
  setVal("todayLow",  r.today_low,  v=>"↓"+v.toFixed(1));
  $("batSub").textContent  = r.battery_source === "gatt" ? "voltage-derived · via update" : "passive";
  $("liveBadge").textContent = r.online ? "Live" : "Offline";
  $("liveDot").style.background = r.online ? "var(--ok)" : "var(--muted2)";
  $("liveDot").style.boxShadow  = r.online ? "0 0 9px var(--ok)" : "none";
  $("batbadge").innerHTML = r.battery_low ? '<span class="badge">Low battery</span>' : "";
  $("todaySub").textContent = (r.today_high_ts && r.today_low_ts)
    ? `high ${hm(r.today_high_ts)} · low ${hm(r.today_low_ts)}` : "—";
  renderBars(r.signal_bars ?? 0);
  renderFreshness();
}
function hm(ts){ return new Date(ts*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }

async function doUpdate(){
  const b = $("updateBtn"); b.disabled = true;
  b.innerHTML = '<span class="spin"></span> Connecting…';
  try{
    const resp = await fetch("/api/update", {method:"POST"});
    if(resp.status === 409){ b.textContent = "Sensor busy"; }
    else if(!resp.ok){ b.textContent = "Failed"; }
    else { b.textContent = "✓ Updated"; await refreshCurrent(); await reload(); }
  }catch(e){ b.textContent = "Failed"; }
  setTimeout(()=>{ b.textContent = "↻ Update"; b.disabled = false; }, 1500);
}

/* ---------- charts ---------- */
function gradient(ctx, color){
  const g = ctx.createLinearGradient(0,0,0,240);
  g.addColorStop(0, color+"44"); g.addColorStop(1, color+"00"); return g;
}
function fmtTick(value){
  const span = (this.max - this.min);
  const d = new Date(value);
  if(span <= 36*3600*1000) return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString([], {month:"short",day:"numeric"});
}
// ONE chart, TWO stacked y-axes (temp panel on top, humidity below) sharing a single
// x-axis. Pan/zoom is on the x-axis only, so both panels move together natively — no
// cross-chart sync code needed (that's why we use one chart, not two).
function mkChart(canvas){
  const ctx = canvas.getContext("2d");
  const ds = (label, color, axis) => ({
    label, yAxisID:axis, data:[], borderColor:color, backgroundColor:gradient(ctx,color),
    borderWidth:2, fill:true, cubicInterpolationMode:"monotone", pointRadius:0, spanGaps:true,
  });
  const yAxis = (color, unit) => ({
    type:"linear", position:"left", stack:"panels", stackWeight:1, offset:true,
    grid:{color:"#ffffff10"}, ticks:{color:color}, title:{display:true, text:unit, color:"#7f90a8"},
  });
  return new Chart(ctx, {
    type:"line",
    data:{datasets:[ ds("Temperature °C", COLORS.temp, "yTemp"),
                     ds("Humidity %",     COLORS.hum,  "yHum") ]},
    options:{responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{mode:"index", axis:"x", intersect:false},
      plugins:{
        // legend hidden on touch; non-interactive on desktop (no accidental series toggle)
        legend:{display: !IS_TOUCH, onClick: () => {}, position:"top",
                labels:{color:"#9fb0c4", usePointStyle:true, boxWidth:8, boxHeight:8, padding:14}},
        // tooltip off on touch (looks bad / awkward); on desktop show a real date, not the raw ms
        tooltip:{enabled: !IS_TOUCH, callbacks:{
          title: items => items.length ? new Date(items[0].parsed.x)
            .toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}) : ""}},
        zoom:{ pan:{enabled:true, mode:"x", onPan:onGesture, onPanComplete:onRangeChange},
               zoom:{wheel:{enabled:true, modifierKey:"ctrl"}, pinch:{enabled:true}, mode:"x",
                     onZoom:onGesture, onZoomComplete:onRangeChange},
               limits:{x:{}} }},
      scales:{
        x:{type:"linear", grid:{color:"#ffffff10"},
           ticks:{color:"#7f90a8", maxTicksLimit:8, autoSkip:true, callback:fmtTick}},
        // first-declared stacked axis renders at the bottom, so declare humidity first
        // to put the temperature panel on top.
        yHum:  yAxis(COLORS.hum,  "%"),
        yTemp: yAxis(COLORS.temp, "°C")}}
  });
}
function applyWindow(){ chart.zoomScale("x", {min: win.from*1000, max: win.to*1000}, "none"); }
function setLimits(){
  if(!extent || !extent.earliest) return;
  chart.options.plugins.zoom.limits.x = {min: extent.earliest*1000, max: extent.latest*1000};
}
function downsample(points, target=180){
  // Average into uniform time buckets so dense recent (per-minute, 0.1°-stepped) data
  // renders as smoothly as the sparse hourly history — no more jagged half.
  if(points.length <= target) return points;
  const x0 = points[0].x, x1 = points[points.length-1].x, bw = ((x1 - x0) || 1) / target;
  const buckets = new Map();
  for(const p of points){
    const b = Math.floor((p.x - x0) / bw);
    let a = buckets.get(b); if(!a){ a = {sx:0, sy:0, n:0}; buckets.set(b, a); }
    a.sx += p.x; a.sy += p.y; a.n++;
  }
  return [...buckets.values()].map(a => ({x:a.sx/a.n, y:a.sy/a.n})).sort((a,b)=>a.x-b.x);
}
function onGesture({chart}){          // fires DURING pan/zoom — refresh the window live (throttled)
  activeToken = null;
  win = {from: Math.round(chart.scales.x.min/1000), to: Math.round(chart.scales.x.max/1000)};
  const t = Date.now();
  if(t - lastFetch > 200){ lastFetch = t; loadWindow(); }
}
function renderHistory(r){
  extent = r.extent;
  // Merge coarse hourly history (older) with fine live readings (recent). Raw readings
  // win for any hour they cover, so the chart is full instead of a tiny recent cluster.
  const rawHours = new Set((r.points||[]).map(p => Math.floor(p.ts/3600)));
  const t = [], h = [];
  for(const b of (r.bands||[])){
    if(rawHours.has(Math.floor(b.hour_ts/3600))) continue;
    t.push({x:b.hour_ts*1000, y:(b.min_temp+b.max_temp)/2});
    h.push({x:b.hour_ts*1000, y:(b.min_hum+b.max_hum)/2});
  }
  for(const p of (r.points||[])){
    t.push({x:p.ts*1000, y:p.temperature});
    h.push({x:p.ts*1000, y:p.humidity});
  }
  t.sort((a,b)=>a.x-b.x); h.sort((a,b)=>a.x-b.x);
  chart.data.datasets[0].data = downsample(t);
  chart.data.datasets[1].data = downsample(h);
  setLimits();
  chart.update("none");
}
async function loadRange(token){       // server-anchored preset (clock-independent)
  let r; try{ r = await (await fetch(`/api/history?range=${token}`)).json(); }catch(e){ return; }
  win = {from: r.from, to: r.to};
  renderHistory(r); applyWindow();
}
async function loadWindow(){           // explicit window (after pan/zoom or data change)
  if(!win) return;
  let r; try{ r = await (await fetch(`/api/history?from=${win.from}&to=${win.to}`)).json(); }catch(e){ return; }
  renderHistory(r);
}
function reload(){ return activeToken ? loadRange(activeToken) : loadWindow(); }
function onRangeChange({chart}){
  const x = chart.scales.x;
  win = {from: Math.round(x.min/1000), to: Math.round(x.max/1000)};
  activeToken = null;                  // now a custom window
  document.querySelectorAll('#ranges button').forEach(b=>b.classList.remove("active"));
  clearTimeout(fetchTimer); fetchTimer = setTimeout(loadWindow, 250);
}
function setRange(r){
  activeToken = r;
  document.querySelectorAll('#ranges button').forEach(b=>b.classList.toggle("active", b.dataset.r === r));
  loadRange(r);
}

/* ---------- gaps + backfill ---------- */
let gapState = null;
async function refreshGaps(){
  try{
    const r = await (await fetch(`/api/gaps?range=week`)).json();
    gapState = r;
    const f = r.fillable || [];
    if(f.length){
      $("gapWrap").classList.add("gap");
      $("gapFillable").textContent = `${f.length} hour(s) missing in the last ~2 days`;
    } else {
      $("gapWrap").classList.remove("gap");
      $("gapFillable").textContent = "Pull the sensor's stored history";
    }
  }catch(e){}
}
function pollBackfill(){
  return new Promise(resolve=>{
    const iv = setInterval(async ()=>{
      let st; try{ st = await (await fetch("/api/backfill/status")).json(); }catch(e){ return; }
      if(st.state === "reading" && st.total){
        const denom = Math.max(st.total, st.received);   // NUMREC can lag actual stream
        $("fillProgressText").textContent = `Reading history… ${st.received} / ${denom} records`;
        $("fillProgressBar").style.width = Math.min(100, Math.round(st.received/denom*100)) + "%";
      } else if(st.state === "connecting"){
        $("fillProgressText").innerHTML = '<span class="spin"></span> Connecting…';
      } else if(st.state === "done"){
        clearInterval(iv);
        $("fillProgressText").textContent = `✓ Filled ${st.filled} hour(s)`;
        $("fillProgressBar").style.width = "100%";
        await refreshGaps(); await reload();
        resolve();
      } else if(st.state === "error"){
        clearInterval(iv);
        $("fillProgressText").textContent = "Backfill failed — try again";
        resolve();
      }
    }, 400);
  });
}
async function doFetch(){
  // Always available: if a >1h gap is known, fetch exactly that range; otherwise pull
  // the whole recoverable window so the device's stored history is synced on demand.
  const f = (gapState && gapState.fillable) || [];
  const now = Math.floor(Date.now()/1000);
  const from = f.length ? f[0] : now - 7 * 86400;
  const to   = f.length ? f[f.length - 1] + 3600 : now;
  $("fillBtn").disabled = true;
  $("fillProgressWrap").style.display = "block";
  $("fillProgressText").innerHTML = '<span class="spin"></span> Connecting…';
  $("fillProgressBar").style.width = "0%";
  try{
    const resp = await fetch("/api/backfill", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({from, to})});
    if(resp.status === 409){ $("fillProgressText").textContent = "Sensor busy — try again"; }
    else if(!resp.ok){ $("fillProgressText").textContent = "Fetch failed"; }
    else { await pollBackfill(); }
  }catch(e){ $("fillProgressText").textContent = "Fetch failed"; }
  $("fillBtn").disabled = false;
  setTimeout(()=>{ $("fillProgressWrap").style.display = "none"; }, 1800);
}

/* ---------- wire up ---------- */
$("updateBtn").addEventListener("click", doUpdate);
$("fillBtn").addEventListener("click", doFetch);
$("ranges").addEventListener("click", e=>{ if(e.target.tagName === "BUTTON") setRange(e.target.dataset.r); });

window.addEventListener("load", ()=>{
  Chart.register(window.ChartZoom || window['chartjs-plugin-zoom']);
  chart = mkChart($("chart"));
  window.chart = chart;
  // Horizontal two-finger scroll pans; plain vertical scroll is left to the page.
  $("chart").addEventListener("wheel", (e)=>{
    if(e.ctrlKey || e.metaKey) return;                 // modifier + wheel -> let the plugin zoom
    if(Math.abs(e.deltaX) > Math.abs(e.deltaY)){        // sideways scroll -> pan
      e.preventDefault();
      chart.pan({x: -e.deltaX}, undefined, "default");
      onGesture({chart});
    }
  }, {passive:false});
  refreshCurrent();
  setRange("24h");
  refreshGaps();
  setInterval(refreshCurrent, 2000);
  setInterval(renderFreshness, 1000);
  setInterval(refreshGaps, 60000);
});
</script>
</body>
</html>
