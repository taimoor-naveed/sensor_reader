<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#160f22" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Sensor</title>
<!-- Apache ECharts 6.1.0 (vendored) -->
<script src="/static/vendor/echarts.min.js"></script>
<style>
  :root{
    --bg:#160f22; --card1:#1f1630; --card2:#261a3b; --txt:#f3edf9;
    --muted:#a893c4; --muted2:#7d6b99; --line:#ffffff14;
    --temp:#b794f6; --temp2:#d6bcfa; --hum:#ff8fd0; --ok:#82e6c0; --warn:#ffb454;
    --pinkgrad:linear-gradient(120deg,#e17ad1,#9d7bf7);
    --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{
    margin:0;color:var(--txt);
    font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    background:radial-gradient(1000px 500px at 85% -10%,#33204f,transparent),
               radial-gradient(900px 600px at -10% 110%,#3a1533,transparent),
               var(--bg);
    min-height:100vh;
    padding:14px;
    padding-left:max(14px, env(safe-area-inset-left));
    padding-right:max(14px, env(safe-area-inset-right));
    padding-bottom:max(20px, env(safe-area-inset-bottom));
  }
  .wrap{max-width:1080px;margin:0 auto}

  /* ---------- header ---------- */
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 16px}
  .title{font-size:18px;font-weight:650;letter-spacing:.01em}
  .subtitle{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-top:2px}
  .hright{display:flex;align-items:center;gap:10px}
  .bars{display:flex;align-items:flex-end;gap:3px;height:16px}
  .bars i{width:4px;border-radius:1px;display:block}
  .badge-live{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#c8b6de;
    background:#82e6c01a;border:1px solid #82e6c033;padding:5px 11px;border-radius:999px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 9px var(--ok)}
  .btn{background:var(--pinkgrad);color:#fff;border:none;
    border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:650;cursor:pointer;
    box-shadow:0 4px 14px #e17ad13d;
    min-height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;white-space:nowrap}
  .btn:disabled{opacity:.6;cursor:default}

  /* ---------- stat cards ---------- */
  .grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
  .card{background:linear-gradient(160deg,var(--card1),var(--card2));
    border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
  .hero{grid-column:span 2;display:flex;flex-direction:column;gap:10px}
  .label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .herorow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .heronum{font-size:clamp(52px,14vw,76px);font-weight:700;line-height:.9;
    background:linear-gradient(120deg,#ffb3e6,#c4a7ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .unit{font-size:22px;color:var(--muted);font-weight:500}
  .pill{padding:6px 13px;border-radius:999px;background:#ff8fd022;color:#ffb3e0;
    font-size:12.5px;border:1px solid #ff8fd045;white-space:nowrap}
  .pill.warn{background:#ffb45422;color:#ffca7a;border-color:#ffb45455}
  .val{font-size:30px;font-weight:700;margin-top:8px}
  .val .u{font-size:15px;color:var(--muted);font-weight:500}
  .sub{font-size:11px;color:var(--muted2);margin-top:6px}
  .fresh{font-size:11px;color:var(--muted2);margin-top:4px}
  .badge{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;
    font-size:11px;background:#ffb45422;color:var(--warn);border:1px solid #ffb45455;vertical-align:middle}
  .today-card{grid-column:span 2}
  .today{font-size:23px;font-weight:700;margin-top:8px;display:flex;align-items:baseline;gap:10px}
  .today .hi{color:#ffb3e6} .today .lo{color:#c4a7ff}
  .today .u{font-size:13px;color:var(--muted);font-weight:500}
  @media(min-width:760px){
    .grid{grid-template-columns:1.4fr 1fr 1fr}
    .hero{grid-column:1;grid-row:span 2}
    .today-card{grid-column:2 / span 2}
  }

  /* ---------- range chips ---------- */
  .chips{position:sticky;top:0;z-index:5;display:flex;gap:8px;margin:16px 0 12px;
    padding:8px 0;background:linear-gradient(var(--bg) 75%,transparent);}
  .chips button{flex:1;font-size:13px;font-weight:600;min-height:44px;border-radius:14px;
    background:#1d1430;color:var(--muted);border:1px solid var(--line);cursor:pointer;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .chips button.active{background:var(--pinkgrad);color:#fff;border-color:transparent;
    box-shadow:0 4px 14px #e17ad13d}

  /* ---------- chart cards ---------- */
  .chartwrap{display:grid;gap:12px}
  @media(min-width:1000px){.chartwrap{grid-template-columns:1fr 1fr}}
  .chartcard{padding:14px 8px 6px 8px}
  .chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    min-height:40px;padding:0 8px}
  .csub{font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .csub .mx{color:var(--txt)} .csub .mn{color:var(--muted)}
  .creadout{text-align:right;font-variant-numeric:tabular-nums;display:none}
  .creadout .rv{display:block;font-size:20px;font-weight:700;line-height:1.1}
  .creadout .rt{display:block;font-size:11px;color:var(--muted2);margin-top:2px}
  .chartcard.scrub .creadout{display:block}
  .chartcard.scrub .csub{visibility:hidden}
  .cchart{height:230px;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
  @media(min-width:760px){.cchart{height:260px}}
  .tcolor{color:var(--temp2)} .hcolor{color:var(--hum)}

  /* ---------- backfill card ---------- */
  .gapcard{margin-top:12px}
  .gapcard.gap{border-color:#ffb45440;background:#ffb4540e}
  .gaprow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .gapfill{font-size:13px;color:var(--muted)}
  .gapcard.gap .gapfill{color:#ffca7a}
  .progress{margin-top:12px}
  .ptrack{height:8px;border-radius:999px;background:#140d20;border:1px solid var(--line);overflow:hidden}
  .pbar{height:100%;width:0;background:var(--pinkgrad);transition:width .3s}
  .ptext{font-size:11.5px;color:#c8b6de;margin-bottom:7px;display:flex;align-items:center;gap:8px}

  .spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;
    border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.05);filter:brightness(1.2)}100%{transform:scale(1)}}
  .pulse{animation:pulse .5s ease-out;display:inline-block}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="title">LYWSD03MMC <span style="color:#ff8fd0">✿</span></div>
      <div class="subtitle">Sensor Monitor ♡</div>
    </div>
    <div class="hright">
      <span class="bars" id="signalBars" title="Signal strength"></span>
      <span class="badge-live"><span class="dot" id="liveDot"></span><span id="liveBadge">—</span></span>
      <button class="btn" id="updateBtn">↻ Update</button>
    </div>
  </header>

  <div class="grid">
    <div class="card hero">
      <div class="label">Temperature</div>
      <div class="herorow">
        <div><span class="heronum" id="temp">--</span><span class="unit"> °C</span></div>
        <span class="pill" id="comfortPill" style="display:none"></span>
      </div>
      <div class="sub" id="dewSub">—</div>
      <div class="fresh" id="tempUpdated">—</div>
    </div>

    <div class="card">
      <div class="label">Humidity</div>
      <div class="val"><span id="hum">--</span><span class="u"> %</span></div>
      <div class="fresh" id="humUpdated">—</div>
    </div>

    <div class="card">
      <div class="label">Battery</div>
      <div class="val"><span id="bat">--</span><span class="u"> %</span><span id="batbadge"></span></div>
      <div class="sub" id="batSub">—</div>
      <div class="fresh" id="batUpdated">—</div>
    </div>

    <div class="card today-card">
      <div class="label">Today</div>
      <div class="today"><span class="hi" id="todayHigh">—</span><span class="lo" id="todayLow">—</span><span class="u">°C</span></div>
      <div class="sub" id="todaySub">—</div>
    </div>
  </div>

  <div class="chips" id="ranges">
    <button data-r="6h">6H</button>
    <button data-r="24h" class="active">24H</button>
    <button data-r="7d">7D</button>
    <button data-r="30d">30D</button>
    <button data-r="all">All</button>
  </div>

  <div class="chartwrap">
    <div class="card chartcard" id="tcard">
      <div class="chead">
        <div>
          <div class="label tcolor">Temperature</div>
          <div class="csub" id="tsub">—</div>
        </div>
        <div class="creadout tcolor" id="tread"></div>
      </div>
      <div class="cchart" id="tchart"></div>
    </div>
    <div class="card chartcard" id="hcard">
      <div class="chead">
        <div>
          <div class="label hcolor">Humidity</div>
          <div class="csub" id="hsub">—</div>
        </div>
        <div class="creadout hcolor" id="hread"></div>
      </div>
      <div class="cchart" id="hchart"></div>
    </div>
  </div>

  <div class="card gapcard" id="gapWrap">
    <div class="gaprow">
      <span class="gapfill" id="gapFillable">Pull the sensor's stored history</span>
      <button class="btn" id="fillBtn" style="min-height:38px;padding:8px 15px;font-size:12.5px">⤓ Fetch from sensor</button>
    </div>
    <div class="progress" id="fillProgressWrap" style="display:none">
      <div class="ptext" id="fillProgressText">Connecting…</div>
      <div class="ptrack"><div class="pbar" id="fillProgressBar"></div></div>
    </div>
  </div>

</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const COLORS = {t:"#c9a7ff", h:"#ff8fd0"};
const charts = {t:null, h:null};
const state = {token:"24h", data:null, scrubUntil:0, scrubbing:false};
let lastSnap = {};

/* =============================== live cards =============================== */
function ago(ts){
  if(!ts) return "—";
  const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if(s < 60)    return `updated ${s}s ago`;
  if(s < 3600)  return `updated ${Math.floor(s/60)}m ago`;
  if(s < 86400) return `updated ${Math.floor(s/3600)}h ago`;
  return `updated ${Math.floor(s/86400)}d ago`;
}
function setVal(id, val, fmt){
  const el = $(id);
  const t = (val === null || val === undefined) ? "--" : fmt(val);
  if(el.textContent !== t){
    el.textContent = t;
    el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
  }
}
function renderBars(n){
  const c = $("signalBars"); c.innerHTML = "";
  for(let i=0;i<4;i++){
    const b = document.createElement("i");
    b.style.height = (5 + i*4) + "px";
    b.style.background = i < n ? COLORS.t : "#3a2b52";
    c.appendChild(b);
  }
}
function renderFreshness(){
  $("tempUpdated").textContent = ago(lastSnap.temperature_ts);
  $("humUpdated").textContent  = ago(lastSnap.humidity_ts);
  $("batUpdated").textContent  = ago(lastSnap.battery_ts);
}
function hm(ts){ return new Date(ts*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
async function refreshCurrent(){
  let r; try{ r = await (await fetch("/api/current")).json(); }catch(e){ return; }
  lastSnap = r;
  setVal("temp", r.temperature, v=>v.toFixed(1));
  setVal("hum",  r.humidity,    v=>v.toFixed(0));
  setVal("bat",  r.battery,     v=>String(v));
  setVal("todayHigh", r.today_high, v=>"↑"+v.toFixed(1));
  setVal("todayLow",  r.today_low,  v=>"↓"+v.toFixed(1));
  $("batSub").textContent = r.battery_source === "gatt" ? "voltage-derived · via update" : "passive";
  $("liveBadge").textContent = r.online ? "Live" : "Offline";
  $("liveDot").style.background = r.online ? "var(--ok)" : "var(--muted2)";
  $("liveDot").style.boxShadow  = r.online ? "0 0 9px var(--ok)" : "none";
  $("batbadge").innerHTML = r.battery_low ? '<span class="badge">Low battery</span>' : "";
  $("todaySub").textContent = (r.today_high_ts && r.today_low_ts)
    ? `high ${hm(r.today_high_ts)} · low ${hm(r.today_low_ts)}` : "—";
  const pill = $("comfortPill");
  if(r.comfort){
    pill.style.display = "";
    pill.textContent = r.comfort;
    pill.classList.toggle("warn", r.comfort !== "comfortable");
  } else pill.style.display = "none";
  $("dewSub").textContent = (r.dew_point != null) ? `dew point ${r.dew_point.toFixed(1)} °C` : "—";
  renderBars(r.signal_bars ?? 0);
  renderFreshness();
}

async function doUpdate(){
  const b = $("updateBtn"); b.disabled = true;
  b.innerHTML = '<span class="spin"></span> Connecting…';
  try{
    const resp = await fetch("/api/update", {method:"POST"});
    if(resp.status === 409){ b.textContent = "Sensor busy"; }
    else if(!resp.ok){ b.textContent = "Failed"; }
    else { b.textContent = "✓ Updated"; await refreshCurrent(); await loadRange(state.token); }
  }catch(e){ b.textContent = "Failed"; }
  setTimeout(()=>{ b.textContent = "↻ Update"; b.disabled = false; }, 1500);
}

/* ================================= charts ================================= */
// Health-app model: range chips -> ONE fetch of a complete, server-aggregated
// series (<= ~360 buckets) -> render. No client buffering, no pan/zoom state.
function baseOption(color){
  return {
    animation:false,
    grid:{left:8, right:14, top:14, bottom:6, containLabel:true},
    tooltip:{trigger:"axis", showContent:false,
      axisPointer:{type:"line", snap:true, z:10,
        lineStyle:{color:"#b9a3d9", width:1, type:"solid"}}},
    xAxis:{type:"time",
      axisLine:{lineStyle:{color:"#3a2b52"}},
      axisTick:{show:false},
      splitLine:{show:false},
      axisLabel:{color:"#a893c4", fontSize:11, hideOverlap:true, formatter:{
        year:"{yyyy}", month:"{MMM}", day:"{d} {MMM}",
        hour:"{HH}:{mm}", minute:"{HH}:{mm}", second:"{HH}:{mm}", millisecond:""}}},
    yAxis:{type:"value", scale:true, splitNumber:4,
      axisLabel:{color:"#a893c4", fontSize:11},
      splitLine:{lineStyle:{color:"rgba(255,255,255,0.08)"}}},
    series:[
      // min/max band drawn as a stacked pair: invisible base at min + shaded (max-min)
      {id:"min", type:"line", stack:"band", data:[], symbol:"none", silent:true,
       smooth:0.4, smoothMonotone:"x",
       lineStyle:{opacity:0}, connectNulls:false, z:1},
      {id:"band", type:"line", stack:"band", data:[], symbol:"none", silent:true,
       smooth:0.4, smoothMonotone:"x",
       lineStyle:{opacity:0}, areaStyle:{color:color, opacity:0.16}, connectNulls:false, z:1},
      {id:"avg", type:"line", data:[], symbol:"none", connectNulls:false, z:3,
       smooth:0.4, smoothMonotone:"x",
       lineStyle:{width:2, color:color}, itemStyle:{color:color}, emphasis:{disabled:true}},
    ],
  };
}
function mkCharts(){
  charts.t = echarts.init($("tchart"), null, {renderer:"canvas"});
  charts.h = echarts.init($("hchart"), null, {renderer:"canvas"});
  charts.t.setOption(baseOption(COLORS.t));
  charts.h.setOption(baseOption(COLORS.h));
  charts.t.group = charts.h.group = "sync";
  echarts.connect("sync");                       // synced axis pointer across both
  charts.t.on("updateAxisPointer", onAxisPointer);
  charts.h.on("updateAxisPointer", onAxisPointer);
  window.addEventListener("resize", ()=>{ charts.t.resize(); charts.h.resize(); });
}
function toLine(series, bucket, key){
  // Drop empty buckets but keep REAL gaps as explicit break points: consecutive
  // samples are connected unless they're more than max(2.5 buckets, 90 min)
  // apart. Sparse data (e.g. hourly history inside 5-min buckets) stays a
  // continuous line; genuine outages still break it.
  const TH = Math.max(2.5 * bucket, 5400) * 1000;
  const pts = [];
  for(const p of series){
    if(p[key] == null) continue;
    pts.push({x: p.t*1000, v: p[key], lo: p[key+"_min"], hi: p[key+"_max"]});
  }
  const segs = [];
  for(const p of pts){
    const seg = segs[segs.length-1];
    if(!seg || p.x - seg[seg.length-1].x > TH) segs.push([p]);
    else seg.push(p);
  }
  // Dense buckets (6H/24H) carry the sensor's 0.1° quantization as a staircase —
  // take a light weighted moving average per segment. The band underneath stays
  // raw min/max, so the true spread remains visible. Never smooths across gaps.
  if(bucket <= 300){
    const W = [1, 2, 3, 2, 1], HALF = 2;
    for(let s = 0; s < segs.length; s++){
      segs[s] = segs[s].map((p, i, seg)=>{
        let sum = 0, wsum = 0;
        for(let k = -HALF; k <= HALF; k++){
          const q = seg[i+k];
          if(!q) continue;
          sum += q.v * W[k+HALF]; wsum += W[k+HALF];
        }
        return {...p, v: sum/wsum};
      });
    }
  }
  const avg=[], mn=[], bd=[];
  segs.forEach((seg, i)=>{
    if(i > 0){
      const bx = (segs[i-1][segs[i-1].length-1].x + seg[0].x) / 2;
      avg.push([bx, null]); mn.push([bx, null]); bd.push([bx, null]);
    }
    for(const p of seg){
      avg.push([p.x, p.v]);
      mn.push([p.x, p.lo != null ? p.lo : p.v]);
      bd.push([p.x, (p.lo != null && p.hi != null) ? p.hi - p.lo : 0]);
    }
  });
  return {avg, mn, bd};
}
function render(r){
  state.data = r;
  const t = toLine(r.series, r.bucket, "temp");
  const h = toLine(r.series, r.bucket, "hum");
  const axis = {min:r.from*1000, max:r.to*1000};
  charts.t.setOption({xAxis:axis, series:[{id:"min",data:t.mn},{id:"band",data:t.bd},{id:"avg",data:t.avg}]});
  charts.h.setOption({xAxis:axis, series:[{id:"min",data:h.mn},{id:"band",data:h.bd},{id:"avg",data:h.avg}]});
  renderSummaries();
}
function renderSummaries(){
  const S = state.data ? state.data.series : [];
  const sum = (avgKey, minKey, maxKey, fmt, unit) => {
    const avgs = S.map(p=>p[avgKey]).filter(v=>v!=null);
    if(!avgs.length) return "no data in range";
    const mins = S.map(p=>p[minKey]).filter(v=>v!=null);
    const maxs = S.map(p=>p[maxKey]).filter(v=>v!=null);
    const lo = Math.min(...(mins.length?mins:avgs)), hi = Math.max(...(maxs.length?maxs:avgs));
    const avg = avgs.reduce((a,b)=>a+b,0)/avgs.length;
    return `<span class="mn">↓${fmt(lo)}</span>  <span class="mx">↑${fmt(hi)}</span>  ⌀${fmt(avg)}${unit}`;
  };
  $("tsub").innerHTML = sum("temp","temp_min","temp_max", v=>v.toFixed(1), "°");
  $("hsub").innerHTML = sum("hum","hum_min","hum_max", v=>v.toFixed(0), "%");
}
function fmtBucketTime(tsec){
  const d = new Date(tsec*1000), b = state.data ? state.data.bucket : 300;
  if(b >= 86400) return d.toLocaleDateString([], {month:"short", day:"numeric"});
  if(b >= 3600)  return d.toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
  const span = state.data ? (state.data.to - state.data.from) : 0;
  return span > 86400
    ? d.toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"})
    : d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}
function nearestBucket(sec){
  const S = state.data ? state.data.series : [];
  if(!S.length) return null;
  const b = state.data.bucket;
  let i = Math.max(0, Math.min(S.length-1, Math.round((sec - S[0].t)/b)));
  for(let d=0; d<S.length; d++){
    for(const j of [i-d, i+d]){
      if(j>=0 && j<S.length && (S[j].temp!=null || S[j].hum!=null)) return S[j];
    }
  }
  return null;
}
function onAxisPointer(ev){
  const ax = ev.axesInfo && ev.axesInfo[0];
  if(!ax || ax.value == null) return;
  const p = nearestBucket(ax.value/1000);
  if(!p) return;
  state.scrubUntil = Date.now() + 4000;
  state.scrubbing = true;
  const time = fmtBucketTime(p.t);
  $("tread").innerHTML = `<span class="rv">${p.temp!=null ? p.temp.toFixed(1)+"°" : "–"}</span><span class="rt">${time}</span>`;
  $("hread").innerHTML = `<span class="rv">${p.hum!=null ? Math.round(p.hum)+"%" : "–"}</span><span class="rt">${time}</span>`;
  $("tcard").classList.add("scrub");
  $("hcard").classList.add("scrub");
}
function endScrubTick(){
  if(state.scrubbing && Date.now() > state.scrubUntil){
    state.scrubbing = false;
    $("tcard").classList.remove("scrub");
    $("hcard").classList.remove("scrub");
    charts.t.dispatchAction({type:"hideTip"});
    charts.h.dispatchAction({type:"hideTip"});
  }
}
async function loadRange(token){
  let r;
  try{ r = await (await fetch(`/api/history?range=${token}`)).json(); }
  catch(e){ return; }
  if(token !== state.token) return;            // a newer chip click won round the race
  render(r);
}
function setRange(token){
  state.token = token;
  document.querySelectorAll("#ranges button").forEach(
    b => b.classList.toggle("active", b.dataset.r === token));
  loadRange(token);
}

/* ============================ gaps + backfill ============================= */
let gapState = null;
async function refreshGaps(){
  try{
    const r = await (await fetch(`/api/gaps?range=week`)).json();
    gapState = r;
    const f = r.fillable || [];
    if(f.length){
      $("gapWrap").classList.add("gap");
      $("gapFillable").textContent = `${f.length} hour(s) missing in the last ~2 days`;
    } else {
      $("gapWrap").classList.remove("gap");
      $("gapFillable").textContent = "Pull the sensor's stored history";
    }
  }catch(e){}
}
function pollBackfill(){
  return new Promise(resolve=>{
    const iv = setInterval(async ()=>{
      let st; try{ st = await (await fetch("/api/backfill/status")).json(); }catch(e){ return; }
      if(st.state === "reading" && st.total){
        const denom = Math.max(st.total, st.received);   // NUMREC can lag actual stream
        $("fillProgressText").textContent = `Reading history… ${st.received} / ${denom} records`;
        $("fillProgressBar").style.width = Math.min(100, Math.round(st.received/denom*100)) + "%";
      } else if(st.state === "connecting"){
        $("fillProgressText").innerHTML = '<span class="spin"></span> Connecting…';
      } else if(st.state === "done"){
        clearInterval(iv);
        $("fillProgressText").textContent = `✓ Filled ${st.filled} hour(s)`;
        $("fillProgressBar").style.width = "100%";
        await refreshGaps(); await loadRange(state.token);
        resolve();
      } else if(st.state === "error"){
        clearInterval(iv);
        $("fillProgressText").textContent = "Backfill failed — try again";
        resolve();
      }
    }, 400);
  });
}
async function doFetch(){
  // If a >1h gap is known, fetch exactly that range; otherwise pull the whole
  // recoverable window so the device's stored history is synced on demand.
  const f = (gapState && gapState.fillable) || [];
  const now = Math.floor(Date.now()/1000);
  const from = f.length ? f[0] : now - 7 * 86400;
  const to   = f.length ? f[f.length - 1] + 3600 : now;
  $("fillBtn").disabled = true;
  $("fillProgressWrap").style.display = "block";
  $("fillProgressText").innerHTML = '<span class="spin"></span> Connecting…';
  $("fillProgressBar").style.width = "0%";
  try{
    const resp = await fetch("/api/backfill", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({from, to})});
    if(resp.status === 409){ $("fillProgressText").textContent = "Sensor busy — try again"; }
    else if(!resp.ok){ $("fillProgressText").textContent = "Fetch failed"; }
    else { await pollBackfill(); }
  }catch(e){ $("fillProgressText").textContent = "Fetch failed"; }
  $("fillBtn").disabled = false;
  setTimeout(()=>{ $("fillProgressWrap").style.display = "none"; }, 1800);
}

/* ================================ wire up ================================= */
$("updateBtn").addEventListener("click", doUpdate);
$("fillBtn").addEventListener("click", doFetch);
$("ranges").addEventListener("click", e=>{
  if(e.target.tagName === "BUTTON") setRange(e.target.dataset.r);
});

window.addEventListener("load", ()=>{
  mkCharts();
  window.__app = {charts, state};
  refreshCurrent();
  setRange("24h");
  refreshGaps();
  setInterval(refreshCurrent, 2000);
  setInterval(renderFreshness, 1000);
  setInterval(refreshGaps, 60000);
  setInterval(endScrubTick, 500);
  // keep the active range fresh — but never mid-scrub or while backgrounded
  setInterval(()=>{
    if(!document.hidden && Date.now() > state.scrubUntil) loadRange(state.token);
  }, 60000);
  document.addEventListener("visibilitychange", ()=>{
    if(!document.hidden){ refreshCurrent(); loadRange(state.token); }
  });
});
</script>
